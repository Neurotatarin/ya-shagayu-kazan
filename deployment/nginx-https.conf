server {
    listen 80;
    server_name kazan-demo.38-180-191-162.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/kazan-demo/acme; }
    location / { return 308 https://kazan-demo.38-180-191-162.sslip.io$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name kazan-demo.38-180-191-162.sslip.io;
    ssl_certificate /etc/kazan-demo-acme/live/kazan-demo.38-180-191-162.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/kazan-demo-acme/live/kazan-demo.38-180-191-162.sslip.io/privkey.pem;
    root /var/www/kazan-demo/current;
    index index.html;
    access_log /var/log/nginx/kazan-demo-access.log;
    error_log /var/log/nginx/kazan-demo-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control 'no-cache' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/kazan-demo/acme; }
    location /assets/ { try_files $uri =404; }
    location /downloads/ { alias /var/www/kazan-demo/downloads/; autoindex off; default_type application/octet-stream; add_header Content-Disposition attachment; }
    location / { try_files $uri $uri/ /index.html; }
}
