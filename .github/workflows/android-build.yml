name: Android APK and native checks
on:
  push:
    branches: [feat/android-demo]
    paths-ignore: [deployment/android-release.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kazan-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python -m unittest discover -s server -p test_server.py
      - run: pnpm exec cap add android && pnpm exec cap sync android && python scripts/configure-android.py
      - run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Package unsigned device candidate
        run: |
          mkdir -p work/android-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk work/android-output/YaShagayuKazan-unsigned.apk
          cp "$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -1)" work/android-output/apksigner.jar
          git rev-parse HEAD > work/android-output/commit.txt
          cd work/android-output && sha256sum *.apk *.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: work/android-output/
          retention-days: 14
      - name: Verified portable signing runtime
        run: |
          mkdir -p work/android-signing-runtime
          curl -fL --retry 2 --max-time 180 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jre_x64_windows_hotspot_21.0.13_9.zip' -o work/android-signing-runtime/java-windows.zip
          echo '2332c0b4cff6bed722da3567c91d5e47568bcba863fa4945d0a8d6fc76158628  work/android-signing-runtime/java-windows.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-runtime
          path: work/android-signing-runtime/
          retention-days: 14
      - name: Build test-only document and instrumentation
        run: |
          pnpm exec vite build --config scripts/android-smoke-vite.config.ts --logLevel error
          mkdir -p android/app/src/debug/assets/public/__native_check android/app/src/androidTest/java/ru/yashagayu/kazan/demo
          cp -r work/android-smoke-web/* android/app/src/debug/assets/public/__native_check/
          cp native/tests/android/*.java android/app/src/androidTest/java/ru/yashagayu/kazan/demo/
          cd android && ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/test-android-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-checks
          path: work/android-checks/
          retention-days: 14
